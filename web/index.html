<body>
  <div id="loading">
    <img src="icare_logo.png" alt="iCare" style="width:160px;height:160px;object-fit:contain;">
    <div class="spinner"></div>
  </div>
  <!-- Jitsi Meet External API — primary: meet.jit.si, fallback: jitsi.ow2.org -->
  <script src="https://meet.jit.si/external_api.js" defer></script>
  <script>
    function _hideLoading() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    }
    window.addEventListener('flutter-first-frame', _hideLoading);
    // Fallback: hide after 30s in case the event never fires
    setTimeout(_hideLoading, 30000);

    // ── Raise Flutter glass pane above platform views (Jitsi iframe) ────────
    window.raiseFlutterLayer = function() {
      document.querySelectorAll('flt-glass-pane,flt-text-editing-host').forEach(function(el) {
        el.style.zIndex = '99999';
      });
    };

    // ── GLOBAL: Ensure Jitsi script has loaded, with fallback retry ────────
    // NOTE: This must be a global function because both the consultation Jitsi
    // and LMS Jitsi scripts (in separate <script> blocks) call it.
    window._ensureJitsiScript = function(callback, retries) {
      retries = retries || 0;
      if (typeof JitsiMeetExternalAPI !== 'undefined') {
        callback();
        return;
      }
      if (retries > 20) {
        console.error('Jitsi script load failed after 10 seconds');
        // Try reloading the script
        var script = document.createElement('script');
        script.src = 'https://jitsi.ow2.org/external_api.js';
        script.onload = function() { callback(); };
        script.onerror = function() {
          // Fallback to meet.jit.si CDN
          var fallbackScript = document.createElement('script');
          fallbackScript.src = 'https://meet.jit.si/external_api.js';
          fallbackScript.onload = function() { callback(); };
          document.head.appendChild(fallbackScript);
        };
        document.head.appendChild(script);
        return;
      }
      setTimeout(function() { window._ensureJitsiScript(callback, retries + 1); }, 500);
    };

    // ── Jitsi Meet helpers — Doctor/Patient Consultation ──────────────────
    var _jitsiApi = null;
    var _jitsiRemoteJoined = false;
    var _jitsiRemoteLeft = false;
    var _jitsiContainerId = 'jitsi-container-' + Date.now();

    window.jitsiJoin = function(roomName, displayName, audioOnly) {
      return new Promise(function(resolve) {
        // Create a fresh unique container ID for each call
        _jitsiContainerId = 'jitsi-container-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5);
        
        window._ensureJitsiScript(function() {
          try {
            if (_jitsiApi) {
              try {
                // Properly destroy old Jitsi API before creating new one
                _jitsiApi.removeAllListeners();
                _jitsiApi.dispose();
              } catch(_) {}
              _jitsiApi = null;
            }
            _jitsiRemoteJoined = false;
            _jitsiRemoteLeft = false;

            // Create the container element dynamically instead of relying on a static ID
            var allContainers = document.querySelectorAll('[id^="jitsi-container-"]');
            allContainers.forEach(function(el) { if (el.parentNode) el.parentNode.removeChild(el); });

            var container = document.getElementById(_jitsiContainerId);
            if (!container) {
              // Container not in DOM yet — create a temporary one
              var tempContainer = document.createElement('div');
              tempContainer.id = _jitsiContainerId;
              tempContainer.style.width = '100%';
              tempContainer.style.height = '100%';
              // Try to find the Flutter platform view container
              var flutterView = document.querySelector('flt-platform-view');
              if (flutterView) {
                flutterView.appendChild(tempContainer);
              } else {
                document.body.appendChild(tempContainer);
              }
              container = tempContainer;
            }

            _jitsiApi = new JitsiMeetExternalAPI('meet.jit.si', {
              roomName: roomName,
              width: '100%',
              height: '100%',
              parentNode: container,
              configOverwrite: {
                startWithAudioMuted: false,
                startWithVideoMuted: audioOnly === true,
                disableDeepLinking: true,
                prejoinPageEnabled: false,
                enableWelcomePage: false,
                enableClosePage: false,
                requireDisplayName: false,
                doNotStoreRoom: true,
                disableInviteFunctions: true,
                disableLobbyMode: true,
                lobby: { enabled: false, autoKnock: false },
                enableLobbyChat: false,
                hideLobbyButton: true,
              },
              interfaceConfigOverwrite: {
                SHOW_JITSI_WATERMARK: false,
                SHOW_WATERMARK_FOR_GUESTS: false,
                MOBILE_APP_PROMO: false,
              },
              userInfo: { displayName: displayName || 'User' }
            });

            // Auto-admit any participant waiting in the lobby
            _jitsiApi.addListener('knockingParticipant', function(e) {
              try { _jitsiApi.executeCommand('answerKnockingParticipant', e.participant.id, true); } catch(_) {}
            });

            // Disable lobby after joining
            _jitsiApi.addListener('videoConferenceJoined', function() {
              setTimeout(function() {
                try { _jitsiApi.executeCommand('toggleLobby', false); } catch(_) {}
              }, 1000);
              // Reset remoteLeft when we join - prevents stale state
              _jitsiRemoteLeft = false;
            });

            // Track user count robustly
            var _jitsiParticipantCount = 1; // self
            _jitsiApi.addListener('participantJoined', function(event) {
              _jitsiParticipantCount++;
              _jitsiRemoteJoined = true;
              _jitsiRemoteLeft = false; // reset when anyone joins
              console.log('Jitsi: participant joined', event.displayName, 'count:', _jitsiParticipantCount);
            });

            _jitsiApi.addListener('participantLeft', function(event) {
              _jitsiParticipantCount = Math.max(0, _jitsiParticipantCount - 1);
              // Only mark remoteLeft if we were connected to someone AND they all left
              if (_jitsiRemoteJoined && _jitsiParticipantCount <= 1) {
                _jitsiRemoteLeft = true;
                console.log('Jitsi: last remote participant left');
              } else {
                console.log('Jitsi: participant left, remaining:', _jitsiParticipantCount);
              }
            });

            // Raise Flutter controls above Jitsi iframe after it loads
            setTimeout(window.raiseFlutterLayer, 1200);

            console.log('Jitsi: joining room', roomName, 'as', displayName);
            resolve('ok');
          } catch(e) {
            console.error('jitsiJoin error:', e);
            resolve('error:' + (e.message || String(e)));
          }
        });
      });
    };

    window.jitsiLeave = function() {
      return new Promise(function(resolve) {
        try {
          if (_jitsiApi) {
            _jitsiApi.removeAllListeners();
            _jitsiApi.dispose();
            _jitsiApi = null;
          }
          _jitsiRemoteJoined = false;
          _jitsiRemoteLeft = false;
          _jitsiParticipantCount = 1;
        } catch(e) { console.warn('jitsiLeave error:', e); }
        resolve();
      });
    };

    window.jitsiMuteMic = function(mute) {
      if (!_jitsiApi) return;
      try {
        _jitsiApi.isAudioMuted().then(function(muted) {
          if (muted !== mute) _jitsiApi.executeCommand('toggleAudio');
        });
      } catch(e) { console.warn('jitsiMuteMic error:', e); }
    };

    window.jitsiMuteCam = function(mute) {
      if (!_jitsiApi) return;
      try {
        _jitsiApi.isVideoMuted().then(function(muted) {
          if (muted !== mute) _jitsiApi.executeCommand('toggleVideo');
        });
      } catch(e) { console.warn('jitsiMuteCam error:', e); }
    };

    window.jitsiIsRemoteJoined = function() {
      if (_jitsiRemoteJoined) return true;
      try { return (_jitsiApi != null && _jitsiApi.getNumberOfParticipants() > 1); } catch(e) { return false; }
    };

    window.jitsiIsRemoteLeft = function() {
      return _jitsiRemoteLeft === true;
    };

    // ── Ringtone (Web Audio API — no external file needed) ─────────────────
    var _ringtoneInterval = null;
    var _ringtoneCtx = null;

    window.playRingtone = function() {
      try {
        if (_ringtoneInterval) return;
        _ringtoneCtx = new (window.AudioContext || window.webkitAudioContext)();

        function ringOnce() {
          if (!_ringtoneCtx) return;
          [480, 440].forEach(function(freq) {
            var osc = _ringtoneCtx.createOscillator();
            var gain = _ringtoneCtx.createGain();
            osc.connect(gain);
            gain.connect(_ringtoneCtx.destination);
            osc.frequency.value = freq;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0, _ringtoneCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.25, _ringtoneCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.25, _ringtoneCtx.currentTime + 0.35);
            gain.gain.linearRampToValueAtTime(0, _ringtoneCtx.currentTime + 0.5);
            osc.start(_ringtoneCtx.currentTime);
            osc.stop(_ringtoneCtx.currentTime + 0.5);
          });
        }

        ringOnce();
        _ringtoneInterval = setInterval(ringOnce, 2000);
      } catch(e) { console.warn('Ringtone error:', e); }
    };

    window.stopRingtone = function() {
      try {
        if (_ringtoneInterval) { clearInterval(_ringtoneInterval); _ringtoneInterval = null; }
        if (_ringtoneCtx) { _ringtoneCtx.close(); _ringtoneCtx = null; }
      } catch(_) {}
    };

    // ── Water Reminder Notifications ──────────────────────────────────────
    var _waterReminderTimer = null;

    window.scheduleWaterReminderInterval = function(intervalMinutes) {
      try {
        if (_waterReminderTimer) { clearInterval(_waterReminderTimer); _waterReminderTimer = null; }
        var ms = intervalMinutes * 60 * 1000;
        _waterReminderTimer = setInterval(function() {
          try {
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
              new Notification('Drink Water 💧', {
                body: 'Time to drink a glass of water! Stay hydrated.',
                icon: '/icons/Icon-192.png',
              });
            }
            window.dispatchEvent(new CustomEvent('icare-reminder', {
              detail: JSON.stringify({ type: 'water', title: 'Drink Water 💧', body: 'Time to drink a glass of water! Stay hydrated.' })
            }));
          } catch(e) { console.warn('Water notification error:', e); }
        }, ms);
        console.log('Water reminder scheduled every', intervalMinutes, 'minutes');
      } catch(e) { console.warn('scheduleWaterReminderInterval error:', e); }
    };

    window.cancelWaterReminder = function() {
      if (_waterReminderTimer) { clearInterval(_waterReminderTimer); _waterReminderTimer = null; }
    };

    // ── Generic Daily Reminder Notifications ──────────────────────────────
    var _dailyReminderTimers = {};

    window.scheduleDailyReminder = function(type, title, body, hour, minute) {
      try {
        if (_dailyReminderTimers[type + '_t']) clearTimeout(_dailyReminderTimers[type + '_t']);
        if (_dailyReminderTimers[type + '_i']) clearInterval(_dailyReminderTimers[type + '_i']);

        function fire() {
          try {
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
              new Notification(title, { body: body, icon: '/icons/Icon-192.png' });
            }
            window.dispatchEvent(new CustomEvent('icare-reminder', {
              detail: JSON.stringify({ type: type, title: title, body: body })
            }));
          } catch(e) { console.warn('Daily reminder fire error:', e); }
        }

        var now  = new Date();
        var next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hour, minute, 0, 0);
        if (next <= now) next.setDate(next.getDate() + 1);
        var delay = next - now;

        _dailyReminderTimers[type + '_t'] = setTimeout(function() {
          fire();
          _dailyReminderTimers[type + '_i'] = setInterval(fire, 24 * 60 * 60 * 1000);
        }, delay);

        console.log('Daily reminder scheduled:', type, 'at',
          (hour < 10 ? '0' : '') + hour + ':' + (minute < 10 ? '0' : '') + minute,
          '— fires in', Math.round(delay / 60000), 'min');
      } catch(e) { console.warn('scheduleDailyReminder error:', e); }
    };

    window.cancelDailyReminder = function(type) {
      try {
        if (_dailyReminderTimers[type + '_t']) { clearTimeout(_dailyReminderTimers[type + '_t']); delete _dailyReminderTimers[type + '_t']; }
        if (_dailyReminderTimers[type + '_i']) { clearInterval(_dailyReminderTimers[type + '_i']); delete _dailyReminderTimers[type + '_i']; }
        console.log('Daily reminder cancelled:', type);
      } catch(e) {}
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- LMS Live Session — Jitsi Meet + MediaRecorder -->
  <script>
    // ── LMS Jitsi Meet ────────────────────────────────────────────────────
    var _lmsJitsiApi = null;
    var _lmsJitsiContainerId = 'lms-jitsi-host-' + Date.now();

    // Raise Flutter glass pane above Jitsi iframe so Flutter buttons work
    window.lmsRaiseFlutterLayer = function() {
      document.querySelectorAll('flt-glass-pane,flt-text-editing-host').forEach(function(el) {
        el.style.zIndex = '99999';
      });
    };

    window.lmsJitsiJoin = function(roomName, displayName, isInstructor) {
      return new Promise(function(resolve) {
        window._ensureJitsiScript(function() {
          try {
            if (_lmsJitsiApi) {
              try {
                _lmsJitsiApi.removeAllListeners();
                _lmsJitsiApi.dispose();
              } catch(_) {}
              _lmsJitsiApi = null;
            }

            // Create unique container ID
            _lmsJitsiContainerId = 'lms-jitsi-host-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5);
            
            var container = document.getElementById(_lmsJitsiContainerId);
            if (!container) {
              // Try to find existing lms-jitsi-host or create a new one
              var existing = document.getElementById('lms-jitsi-host');
              if (existing) {
                container = existing;
                container.id = _lmsJitsiContainerId;
              } else {
                container = document.createElement('div');
                container.id = _lmsJitsiContainerId;
                container.style.width = '100%';
                container.style.height = '100%';
                container.style.background = '#1C2333';
                container.style.position = 'relative';
                var flutterView = document.querySelector('flt-platform-view');
                if (flutterView) {
                  flutterView.appendChild(container);
                } else {
                  // Append to a specific area or body
                  var lmsHost = document.querySelector('[id$="-jitsi-view"]');
                  if (lmsHost) lmsHost.appendChild(container);
                  else document.body.appendChild(container);
                }
              }
            }

            _lmsJitsiApi = new JitsiMeetExternalAPI('meet.jit.si', {
              roomName: roomName,
              width: '100%',
              height: '100%',
              parentNode: container,
              configOverwrite: {
                startWithAudioMuted: false,
                startWithVideoMuted: false,
                disableDeepLinking: true,
                prejoinPageEnabled: false,
                enableWelcomePage: false,
                enableClosePage: false,
                requireDisplayName: false,
                doNotStoreRoom: true,
                disableInviteFunctions: true,
                disableLobbyMode: true,
                lobby: { enabled: false, autoKnock: false },
                enableLobbyChat: false,
                hideLobbyButton: true,
              },
              interfaceConfigOverwrite: {
                SHOW_JITSI_WATERMARK: false,
                SHOW_WATERMARK_FOR_GUESTS: false,
                MOBILE_APP_PROMO: false,
              },
              userInfo: { displayName: displayName || (isInstructor ? 'Instructor' : 'Student') }
            });

            // Auto-admit any participant waiting in the lobby
            _lmsJitsiApi.addListener('knockingParticipant', function(e) {
              try { _lmsJitsiApi.executeCommand('answerKnockingParticipant', e.participant.id, true); } catch(_) {}
            });

            // If instructor: disable lobby right after joining so students join directly
            if (isInstructor) {
              _lmsJitsiApi.addListener('videoConferenceJoined', function() {
                setTimeout(function() {
                  try { _lmsJitsiApi.executeCommand('toggleLobby', false); } catch(_) {}
                }, 1000);
              });
            }

            console.log('LMS Jitsi: joined room', roomName, isInstructor ? '(instructor)' : '(student)');

            // Raise Flutter layer after Jitsi loads so Flutter buttons remain clickable
            setTimeout(window.lmsRaiseFlutterLayer, 1200);
            resolve('ok');
          } catch(e) {
            console.error('lmsJitsiJoin error:', e);
            resolve('error:' + (e.message || String(e)));
          }
        });
      });
    };

    window.lmsJitsiLeave = function() {
      return new Promise(function(resolve) {
        try {
          if (_lmsJitsiApi) {
            _lmsJitsiApi.removeAllListeners();
            _lmsJitsiApi.dispose();
            _lmsJitsiApi = null;
          }
        } catch(_) {}
        resolve();
      });
    };

    window.lmsJitsiMuteMic = function(mute) {
      if (!_lmsJitsiApi) return;
      try {
        _lmsJitsiApi.isAudioMuted().then(function(muted) {
          if (muted !== mute) _lmsJitsiApi.executeCommand('toggleAudio');
        });
      } catch(e) { console.warn('lmsJitsiMuteMic error:', e); }
    };

    window.lmsJitsiMuteCamera = function(mute) {
      if (!_lmsJitsiApi) return;
      try {
        _lmsJitsiApi.isVideoMuted().then(function(muted) {
          if (muted !== mute) _lmsJitsiApi.executeCommand('toggleVideo');
        });
      } catch(e) { console.warn('lmsJitsiMuteCamera error:', e); }
    };

    // ── LMS MediaRecorder — session recording (instructor only) ───────────
    window._lmsRecorder = null;
    window._lmsChunks = [];
    window._lmsStream = null;

    window.lmsStartRecording = async function() {
      try {
        if (window._lmsRecorder && window._lmsRecorder.state === 'recording') return;

        // Request a fresh media stream for recording
        var stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
          window._lmsStream = stream;
        } catch(e) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            window._lmsStream = stream;
          } catch(audioErr) {
            console.warn('LMS: no recording stream available:', audioErr.message);
            return;
          }
        }

        window._lmsChunks = [];
        var mimeType = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']
          .find(function(t) { return MediaRecorder.isTypeSupported(t); }) || 'video/webm';

        window._lmsRecorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 500000 });
        window._lmsRecorder.ondataavailable = function(e) {
          if (e.data && e.data.size > 0) window._lmsChunks.push(e.data);
        };
        window._lmsRecorder.start(5000);
        console.log('LMS: recording started');
      } catch(e) {
        console.warn('LMS: recording unavailable:', e.message);
      }
    };

    // Stop recording → upload to Cloudinary → save URL in LMS
    window.lmsStopRecordingAndUpload = function(sessionId, backendUrl, authToken) {
      if (!window._lmsRecorder) return;

      var doSave = async function() {
        if (window._lmsStream) {
          window._lmsStream.getTracks().forEach(function(t) { t.stop(); });
          window._lmsStream = null;
        }
        var blob = new Blob(window._lmsChunks, { type: 'video/webm' });
        window._lmsChunks = [];

        if (blob.size < 5000) { console.log('LMS: recording too short, skipping save'); return; }

        var sizeMB = (blob.size / 1048576).toFixed(1);
        console.log('LMS: uploading session recording (' + sizeMB + ' MB)...');

        try {
          var signResp = await fetch(
            backendUrl + '/upload/sign?folder=icare%2Flms-recordings&resource_type=video',
            { headers: { 'Authorization': 'Bearer ' + authToken } }
          );
          var sign = await signResp.json();

          if (!sign.success || !sign.cloud_name) {
            console.warn('LMS: could not get Cloudinary signature:', sign);
            return;
          }

          var fd = new FormData();
          fd.append('file', blob, 'icare-session-' + sessionId + '.webm');
          fd.append('api_key', sign.api_key);
          fd.append('timestamp', String(sign.timestamp));
          fd.append('signature', sign.signature);
          fd.append('folder', sign.folder);

          var uploadResp = await fetch(
            'https://api.cloudinary.com/v1_1/' + sign.cloud_name + '/video/upload',
            { method: 'POST', body: fd }
          );
          var data = await uploadResp.json();

          if (!data.secure_url) {
            console.warn('LMS: Cloudinary upload error:', data.error || data);
            return;
          }

          await fetch(backendUrl + '/live-sessions/' + sessionId + '/set-recording-url', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
            body: JSON.stringify({ recordingUrl: data.secure_url }),
          });
          console.log('LMS: recording saved:', data.secure_url);
          if (window._lmsRecordingSavedCallback) {
            try { window._lmsRecordingSavedCallback(data.secure_url); } catch(_) {}
          }
        } catch(e) {
          console.warn('LMS: upload failed:', e.message);
        }
      };

      if (window._lmsRecorder.state === 'recording') {
        window._lmsRecorder.onstop = doSave;
        window._lmsRecorder.stop();
      } else {
        doSave();
      }
    };
  </script>
